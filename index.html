<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Song Library</title>

<link
  href="https://unpkg.com/tabulator-tables@5.5.2/dist/css/tabulator.min.css"
  rel="stylesheet"
/>

<style>

* {
  box-sizing: border-box;
}

body {
  font-family: Inter, Arial, sans-serif;
  margin: 0;
  padding: 24px;
  background: #0b0b0b;
  color: #f5f5f5;
}

/* HERO */

.hero {
  margin-bottom: 28px;
}

.hero-title {
  display: flex;
  align-items: center;
  gap: 16px;
}

.logo {
  width: 72px;
  height: 72px;
  object-fit: cover;
  border-radius: 16px;
}

.hero p {
  margin-top: 8px;
  color: #ff9f1c;
}

h1 {
  font-size: 2.5rem;
  margin: 0;
}

/* SEARCH */

#search-input {
  width: 100%;
  padding: 14px 16px;
  border: 1px solid #2a2a2a;
  border-radius: 14px;
  background: #151515;
  color: white;
  font-size: 16px;
  outline: none;
  margin-bottom: 24px;
}

#search-input:focus {
  border-color: #ff9f1c;
  box-shadow: 0 0 0 3px rgba(255,159,28,0.15);
}

/* FOLDERS */

.genre-block {
  margin-bottom: 14px;
}

.genre-header {
  display: flex;
  align-items: center;
  gap: 12px;
  background: #151515;
  padding: 16px;
  border-radius: 14px;
  cursor: pointer;
  border: 1px solid #242424;
  transition: all 0.15s ease;
}

.genre-header:hover {
  background: #1d1d1d;
  border-color: #ff9f1c;
}

.genre-icon {
  font-size: 1.1rem;
}

.genre-name {
  font-weight: 700;
  color: #ffb347;
  flex: 1;
}

.genre-count {
  color: #777;
  font-size: 0.9rem;
}

/* TABLE */

.genre-content {
  display: none;
  margin-top: 10px;
}

.genre-content.open {
  display: block;
}

.tabulator {
  border: none !important;
  border-radius: 14px;
  overflow: hidden;
  background: #121212;
}

.tabulator-header {
  background: #181818 !important;
  border: none !important;
}

.tabulator-col {
  background: #181818 !important;
  color: #ff9f1c !important;
  border-right: 1px solid #2a2a2a !important;
}

.tabulator-row {
  background: #121212;
  color: white;
  border-bottom: 1px solid #1f1f1f;
}

.tabulator-row:nth-child(even) {
  background: #161616;
}

.tabulator-row:hover {
  background: #241400 !important;
}

.tabulator-cell {
  border-right: 1px solid #1f1f1f !important;
}

.tabulator-footer {
  background: #181818 !important;
  border-top: 1px solid #2a2a2a !important;
}

.tabulator-page {
  background: #242424 !important;
  color: white !important;
  border: none !important;
  border-radius: 6px;
}

.tabulator-page.active {
  background: #ff9f1c !important;
  color: black !important;
}

/* MOBILE */

@media (max-width: 768px) {

  body {
    padding: 16px;
  }

  h1 {
    font-size: 2rem;
  }

  .logo {
    width: 56px;
    height: 56px;
  }

  .genre-header {
    padding: 14px;
  }

}

</style>
</head>

<body>

<div class="hero">

  <div class="hero-title">

    <img
      src="logo.png"
      alt="Logo"
      class="logo"
      onerror="this.style.display='none'"
    />

    <h1>Song Library</h1>

  </div>

  <p id="subtitle">
    Loading collection...
  </p>

</div>

<input
  id="search-input"
  type="text"
  placeholder="Search songs, artists, albums..."
/>

<div id="genres-container"></div>

<script src="https://unpkg.com/tabulator-tables@5.5.2/dist/js/tabulator.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<script>

let genres = [];

const tables = {};

function safeId(name) {

  return name.replace(/[^a-zA-Z0-9]/g, "_");

}

async function loadGenres() {

  const response = await fetch("genres.json");

  genres = await response.json();

  buildFolders();

  let totalSongs = 0;

  for (const genre of genres) {

    Papa.parse(genre.file, {

      download: true,
      header: true,
      skipEmptyLines: true,

      complete: function(results) {

        const songs = results.data.filter(song => {

          return song.Title && song.Title.trim() !== "";

        });

        totalSongs += songs.length;

        document.getElementById(
          "count-" + safeId(genre.name)
        ).textContent =
          songs.length + " tracks";

        document.getElementById("subtitle")
          .textContent =
          totalSongs.toLocaleString() +
          " searchable tracks";

        tables[genre.name] = songs;

      }

    });

  }

}

function buildFolders() {

  const container =
    document.getElementById("genres-container");

  container.innerHTML = "";

  genres.forEach(genre => {

    const id = safeId(genre.name);

    const block =
      document.createElement("div");

    block.className = "genre-block";

    block.innerHTML = `

      <div
        class="genre-header"
        onclick="toggleGenre('${genre.name}')"
      >

        <div class="genre-icon">
          📁
        </div>

        <div class="genre-name">
          ${genre.name}
        </div>

        <div
          class="genre-count"
          id="count-${id}"
        >
          Loading...
        </div>

      </div>

      <div
        class="genre-content"
        id="content-${id}"
      >

        <div id="table-${id}"></div>

      </div>

    `;

    container.appendChild(block);

  });

}

function toggleGenre(name) {

  const id = safeId(name);

  const content =
    document.getElementById(
      "content-" + id
    );

  const isOpen =
    content.classList.contains("open");

  if (isOpen) {

    content.classList.remove("open");

    return;

  }

  content.classList.add("open");

  if (
    content.dataset.loaded === "true"
  ) return;

  const songs = tables[name] || [];

  new Tabulator(
    "#table-" + id,
    {

      data: songs,

      layout: "fitColumns",

      pagination: true,
      paginationSize: 50,

      movableColumns: true,

      columns: [

        {
          title: "Title",
          field: "Title",
          minWidth: 220
        },

        {
          title: "Artist",
          field: "Artist",
          minWidth: 220
        },

        {
          title: "Album",
          field: "Album",
          minWidth: 300
        },

        {
          title: "Year",
          field: "Year",
          width: 100,
          hozAlign: "center"
        },

        {
          title: "Length",
          field: "Length",
          width: 100,
          hozAlign: "center"
        },

        {
          title: "BPM",
          field: "BPM",
          width: 90,
          hozAlign: "center"
        }

      ]

    }
  );

  content.dataset.loaded = "true";

}

document
  .getElementById("search-input")
  .addEventListener(
    "input",
    function() {

      const value =
        this.value.toLowerCase();

      genres.forEach(genre => {

        const id =
          safeId(genre.name);

        const content =
          document.getElementById(
            "content-" + id
          );

        const songs =
          tables[genre.name] || [];

        const filtered =
          songs.filter(song => {

            return (
              song.Title?.toLowerCase().includes(value) ||
              song.Artist?.toLowerCase().includes(value) ||
              song.Album?.toLowerCase().includes(value)
            );

        });

        document.getElementById(
          "count-" + id
        ).textContent =
          filtered.length + " tracks";

        // AUTO OPEN MATCHING FOLDERS

        if (
          value &&
          filtered.length > 0
        ) {

          content.classList.add("open");

          // CREATE TABLE IF NEEDED

          if (
            content.dataset.loaded !== "true"
          ) {

            toggleGenre(genre.name);

          }

          // FILTER TABLE

          Tabulator.findTable(
            "#table-" + id
          )[0].setData(filtered);

        }

        // RESET WHEN SEARCH CLEARED

        else if (!value) {

          if (
            Tabulator.findTable(
              "#table-" + id
            )[0]
          ) {

            Tabulator.findTable(
              "#table-" + id
            )[0].setData(songs);

          }

        }

      });

  });
loadGenres();

</script>

</body>
</html>
