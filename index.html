<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Song Library</title>

  <link
    href="https://unpkg.com/tabulator-tables@5.5.2/dist/css/tabulator.min.css"
    rel="stylesheet"
  />

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      background: #0f0f0f;
      color: white;
      font-family: Inter, Arial, sans-serif;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 20px;
    }

    #search-input {
      width: 100%;
      padding: 14px 16px;
      border: none;
      border-radius: 14px;
      background: #1a1a1a;
      color: white;
      font-size: 16px;
      margin-bottom: 24px;
      outline: none;
    }

    #search-input::placeholder {
      color: #777;
    }

    /* DESKTOP TABLE */

    .tabulator {
      border: none;
      background: #121212;
      color: white;
      border-radius: 12px;
      overflow: hidden;
    }

    .tabulator-header {
      background: #181818 !important;
      border-bottom: 1px solid #2a2a2a;
    }

    .tabulator-col {
      background: #181818 !important;
      color: white;
      border-right: 1px solid #2a2a2a !important;
    }

    .tabulator-row {
      background: #121212;
      color: white;
    }

    .tabulator-row:nth-child(even) {
      background: #181818;
    }

    .tabulator-row:hover {
      background: #242424 !important;
    }

    /* MOBILE CARDS */

    .song-card {
      background: #181818;
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 18px;
      border: 1px solid #242424;
    }

    .song-title {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .song-artist {
      color: #d0d0d0;
      margin-bottom: 12px;
    }

    .song-meta {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      color: #999;
      font-size: 0.9rem;
      margin-bottom: 10px;
    }

    .song-album {
      color: #777;
      font-size: 0.9rem;
      line-height: 1.4;
    }

    @media (max-width: 768px) {

      body {
        padding: 16px;
      }

      h1 {
        font-size: 2rem;
      }
    }

  </style>
</head>

<body>

  <h1>Song Library</h1>

  <input
    id="search-input"
    type="text"
    placeholder="Search songs, artists, albums..."
  />

  <div id="song-table"></div>

  <script src="https://unpkg.com/tabulator-tables@5.5.2/dist/js/tabulator.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <script>

    Papa.parse("songs.csv", {

      download: true,
      header: true,

      complete: function(results) {

        const songs = results.data.filter(song => song.Title);

        const container = document.getElementById("song-table");

        // MOBILE VIEW

        if (window.innerWidth <= 768) {

          function renderCards(search = "") {

            container.innerHTML = "";

            const filtered = songs.filter(song => {

              const s = search.toLowerCase();

              return (
                song.Title?.toLowerCase().includes(s) ||
                song.Artist?.toLowerCase().includes(s) ||
                song.Album?.toLowerCase().includes(s)
              );

            });

            filtered.forEach(song => {

              const card = document.createElement("div");

              card.className = "song-card";

              card.innerHTML = `
                <div class="song-title">
                  ${song.Title || ""}
                </div>

                <div class="song-artist">
                  ${song.Artist || ""}
                </div>

                <div class="song-meta">
                  <span>${song.Year || ""}</span>
                  <span>${song.Length || ""}</span>
                  <span>${song.BPM || ""} BPM</span>
                </div>

                <div class="song-album">
                  ${song.Album || ""}
                </div>
              `;

              container.appendChild(card);

            });
          }

          renderCards();

          document
            .getElementById("search-input")
            .addEventListener("input", function() {

              renderCards(this.value);

          });

        }

        // DESKTOP VIEW

        else {

          const table = new Tabulator("#song-table", {

            data: songs,

            layout: "fitColumns",

            pagination: true,
            paginationSize: 25,

            movableColumns: true,

            columns: [

              {
                title: "Title",
                field: "Title",
                minWidth: 220
              },

              {
                title: "Artist",
                field: "Artist",
                minWidth: 220
              },

              {
                title: "Album",
                field: "Album",
                minWidth: 300
              },

              {
                title: "Year",
                field: "Year",
                width: 100
              },

              {
                title: "Length",
                field: "Length",
                width: 100
              },

              {
                title: "BPM",
                field: "BPM",
                width: 90
              }

            ]
          });

          document
            .getElementById("search-input")
            .addEventListener("input", function() {

              const value = this.value;

              table.setFilter([
                [
                  { field: "Title", type: "like", value: value },
                  { field: "Artist", type: "like", value: value },
                  { field: "Album", type: "like", value: value }
                ]
              ]);

          });

        }

      }

    });

  </script>

</body>
</html>
