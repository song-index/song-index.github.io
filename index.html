<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>


  <!-- Tabulator -->
  <link
    href="https://unpkg.com/tabulator-tables@5.5.2/dist/css/tabulator.min.css"
    rel="stylesheet"
  />

  <style>

    * {
      box-sizing: border-box;
    }
.hero {
  margin-bottom: 28px;
}

.hero-title {
  display: flex;
  align-items: center;
  gap: 16px;
}

.logo {
  width: 72px !important;
  height: 72px !important;

  object-fit: cover;

  border-radius: 16px;

  display: block;

  flex-shrink: 0;
}

.hero p {
  margin-top: 8px;
  color: #ff9f1c;
}
body {
  font-family: Inter, Arial, sans-serif;
  margin: 0;
  padding: 24px;

  background: #0b0b0b;
  color: #f5f5f5;
}

    h1 {
      font-size: 2.5rem;
      margin-bottom: 20px;
    }

    #controls {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    #search-input,
    #sort-select {
      padding: 14px 16px;
      border: none;
      border-radius: 14px;
      background: #1a1a1a;
      color: white;
      font-size: 16px;
      outline: none;
    }

    #search-input {
      flex: 1;
      min-width: 220px;
    }

    #sort-select {
      width: 180px;
    }

    #search-input::placeholder {
      color: #777;
    }

    /* DESKTOP TABLE */

    .tabulator {
      border: none;
      background: #121212;
      color: white;
      border-radius: 14px;
      overflow: hidden;
    }

.tabulator-header {
  background: #1a1a1a;
  color: #ff9f1c;
  border: none;
}

    .tabulator-col {
      background: #181818 !important;
      color: white;
      border-right: 1px solid #2a2a2a !important;
    }

    .tabulator-row {
      background: #121212;
      color: white;
      min-height: 34px !important;
      border-bottom: 1px solid #1f1f1f;
    }

.tabulator-row:nth-child(even) {
  background: #161616;
}

.tabulator-row:hover {
  background: #2a1a0a;
}

    .tabulator-cell {
      border-right: 1px solid #1f1f1f !important;
      padding: 6px 10px !important;
    }

    .tabulator-footer {
      background: #181818;
      border-top: 1px solid #2a2a2a;
    }

    .tabulator-page {
      background: #242424 !important;
      color: white !important;
      border: none !important;
      border-radius: 6px;
      margin: 0 4px;
    }

    .tabulator-page.active {
      background: white !important;
      color: black !important;
    }

    /* MOBILE CARDS */

.song-card {
  background: #141414;

  border-radius: 16px;

  padding: 18px;
  margin-bottom: 16px;

  border: 1px solid #2b2b2b;

  transition:
    transform 0.15s ease,
    background 0.15s ease;
}
.song-card:hover {
  background: #1d1d1d;
  transform: translateY(-2px);
}
    
.song-title {
  font-size: 1.1rem;
  font-weight: 700;

  margin-bottom: 6px;

  color: #ffb347;
}

    .song-artist {
      color: #d0d0d0;
      margin-bottom: 12px;
    }

.song-meta {
  display: flex;
  gap: 12px;
  font-size: 0.9rem;
  color: #ff9f1c;
  margin-bottom: 10px;
  flex-wrap: wrap;
}

    .song-album {
      color: #777;
      font-size: 0.9rem;
      line-height: 1.4;
    }
    #search-input,
#sort-select {

  background: #151515;
  color: white;

  border: 1px solid #2a2a2a;

  transition: all 0.2s ease;
}
    #search-input:focus,
#sort-select:focus {

  border-color: #ff9f1c;

  box-shadow:
    0 0 0 3px rgba(255,159,28,0.15);
}
@media (min-width: 769px) {

  #sort-select {
    display: none;
  }

}
    @media (max-width: 768px) {

      body {
        padding: 16px;
      }

      h1 {
        font-size: 2rem;
      }

      #controls {
        flex-direction: column;
      }

      #sort-select {
        width: 100%;
      }
    }

  </style>
</head>

<body>
    <div class="hero">

  <div class="hero-title">

    <img
      src="logo.png"
      alt="Logo"
      class="logo"
    />

    <h1>Song Library</h1>

  </div>

  <p>
    4,000+ searchable tracks
  </p>

</div>

  <div id="controls">

    <input
      id="search-input"
      type="text"
      placeholder="Search songs, artists, albums..."
    />

<select id="sort-select">

  <option value="">Sort By</option>

  <option value="title-asc">
    Title (A-Z)
  </option>

  <option value="title-desc">
    Title (Z-A)
  </option>

  <option value="artist-asc">
    Artist (A-Z)
  </option>

  <option value="artist-desc">
    Artist (Z-A)
  </option>

  <option value="year-desc">
    Year (Newest)
  </option>

  <option value="year-asc">
    Year (Oldest)
  </option>

  <option value="bpm-desc">
    BPM (Highest)
  </option>

  <option value="bpm-asc">
    BPM (Lowest)
  </option>

</select>

  </div>

  <div id="song-table"></div>

  <!-- Scripts -->

  <script src="https://unpkg.com/tabulator-tables@5.5.2/dist/js/tabulator.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <script>

    Papa.parse("songs.csv", {

      download: true,
      header: true,

      complete: function(results) {

        const songs = results.data.filter(song => {

          return (
            song.Title &&
            song.Title.trim() !== "" &&
            song.Artist &&
            song.Artist.trim() !== ""
          );

        });

        const container =
          document.getElementById("song-table");

        // MOBILE VIEW

        if (window.innerWidth <= 768) {

          function renderCards(search = "") {

            container.innerHTML = "";

            const sortValue =
              document.getElementById("sort-select").value;

            let filtered = songs.filter(song => {

              const s = search.toLowerCase();

              return (
                song.Title?.toLowerCase().includes(s) ||
                song.Artist?.toLowerCase().includes(s) ||
                song.Album?.toLowerCase().includes(s)
              );

            });

            // SORTING
if (sortValue === "title-asc") {

  filtered.sort((a, b) =>
    a.Title.localeCompare(b.Title)
  );

}

if (sortValue === "title-desc") {

  filtered.sort((a, b) =>
    b.Title.localeCompare(a.Title)
  );

}

if (sortValue === "artist-asc") {

  filtered.sort((a, b) =>
    a.Artist.localeCompare(b.Artist)
  );

}

if (sortValue === "artist-desc") {

  filtered.sort((a, b) =>
    b.Artist.localeCompare(a.Artist)
  );

}

if (sortValue === "year-asc") {

  filtered.sort((a, b) =>
    Number(a.Year) - Number(b.Year)
  );

}

if (sortValue === "year-desc") {

  filtered.sort((a, b) =>
    Number(b.Year) - Number(a.Year)
  );

}

if (sortValue === "bpm-asc") {

  filtered.sort((a, b) =>
    Number(a.BPM) - Number(b.BPM)
  );

}

if (sortValue === "bpm-desc") {

  filtered.sort((a, b) =>
    Number(b.BPM) - Number(a.BPM)
  );

}

            filtered.forEach(song => {

              const card = document.createElement("div");

              card.className = "song-card";

              card.innerHTML = `
                <div class="song-title">
                  ${song.Title || ""}
                </div>

                <div class="song-artist">
                  ${song.Artist || ""}
                </div>

                <div class="song-meta">
                  <span>${song.Year || ""}</span>
                  <span>${song.Length || ""}</span>
                  <span>${song.BPM || ""} BPM</span>
                </div>

                <div class="song-album">
                  ${song.Album || ""}
                </div>
              `;

              container.appendChild(card);

            });

          }

          renderCards();

          // SEARCH

          document
            .getElementById("search-input")
            .addEventListener("input", function() {

              renderCards(this.value);

          });

          // SORT

          document
            .getElementById("sort-select")
            .addEventListener("change", function() {

              renderCards(
                document.getElementById("search-input").value
              );

          });

        }

        // DESKTOP VIEW

        else {

          const table = new Tabulator("#song-table", {

            data: songs,

            layout: "fitColumns",

            pagination: true,
            paginationSize: 50,

            movableColumns: true,

            columns: [

              {
                title: "Title",
                field: "Title",
                minWidth: 220
              },

              {
                title: "Artist",
                field: "Artist",
                minWidth: 220
              },

              {
                title: "Album",
                field: "Album",
                minWidth: 320
              },

              {
                title: "Year",
                field: "Year",
                width: 100,
                hozAlign: "center"
              },

              {
                title: "Length",
                field: "Length",
                width: 100,
                hozAlign: "center"
              },

              {
                title: "BPM",
                field: "BPM",
                width: 90,
                hozAlign: "center"
              }

            ]

          });

          // SEARCH

          document
            .getElementById("search-input")
            .addEventListener("input", function() {

              const value = this.value;

              table.setFilter([
                [
                  { field: "Title", type: "like", value: value },
                  { field: "Artist", type: "like", value: value },
                  { field: "Album", type: "like", value: value }
                ]
              ]);

          });

          // SORTING

          document
            .getElementById("sort-select")
            .addEventListener("change", function() {

              const value = this.value;

if (!value) {
  table.clearSort();
  return;
}

if (value === "title-asc") {
  table.setSort("Title", "asc");
}

if (value === "title-desc") {
  table.setSort("Title", "desc");
}

if (value === "artist-asc") {
  table.setSort("Artist", "asc");
}

if (value === "artist-desc") {
  table.setSort("Artist", "desc");
}

if (value === "year-asc") {
  table.setSort("Year", "asc");
}

if (value === "year-desc") {
  table.setSort("Year", "desc");
}

if (value === "bpm-asc") {
  table.setSort("BPM", "asc");
}

if (value === "bpm-desc") {
  table.setSort("BPM", "desc");
}

          });

        }

      }

    });

  </script>

</body>
</html>
