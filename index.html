<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Song Library</title>

<link
  href="https://unpkg.com/tabulator-tables@5.5.2/dist/css/tabulator.min.css"
  rel="stylesheet"
/>

<style>

* {
  box-sizing: border-box;
}

body {
  font-family: Inter, Arial, sans-serif;
  margin: 0;
  padding: 24px;
  background: #0b0b0b;
  color: #f5f5f5;
}

/* HERO */

.hero {
  margin-bottom: 28px;
}

.hero-title {
  display: flex;
  align-items: center;
  gap: 16px;
}

.logo {
  width: 72px;
  height: 72px;
  object-fit: cover;
  border-radius: 16px;
}

.hero p {
  margin-top: 8px;
  color: #ff9f1c;
}

h1 {
  font-size: 2.5rem;
  margin: 0;
}

/* SEARCH */

#search-input {
  width: 100%;
  padding: 14px 16px;
  border: 1px solid #2a2a2a;
  border-radius: 14px;
  background: #151515;
  color: white;
  font-size: 16px;
  outline: none;
  margin-bottom: 24px;
}

#search-input:focus {
  border-color: #ff9f1c;
  box-shadow: 0 0 0 3px rgba(255,159,28,0.15);
}

/* GENRES */

.genre-block {
  margin-bottom: 14px;
}

.genre-header {
  display: flex;
  align-items: center;
  gap: 12px;
  background: #151515;
  padding: 16px;
  border-radius: 14px;
  cursor: pointer;
  border: 1px solid #242424;
  transition: all 0.15s ease;
}

.genre-header:hover {
  background: #1d1d1d;
  border-color: #ff9f1c;
}

.genre-icon {
  font-size: 1.1rem;
}

.genre-name {
  font-weight: 700;
  color: #ffb347;
  flex: 1;
}

.genre-count {
  color: #777;
  font-size: 0.9rem;
}

/* TABLE */

.genre-content {
  display: none;
  margin-top: 10px;
}

.genre-content.open {
  display: block;
}

.tabulator {
  border: none !important;
  border-radius: 14px;
  overflow: hidden;
  background: #121212;
}

.tabulator-header {
  background: #181818 !important;
  border: none !important;
}

.tabulator-col {
  background: #181818 !important;
  color: #ff9f1c !important;
  border-right: 1px solid #2a2a2a !important;
}

.tabulator-row {
  background: #121212;
  color: white;
  border-bottom: 1px solid #1f1f1f;
}

.tabulator-row:nth-child(even) {
  background: #161616;
}

.tabulator-row:hover {
  background: #241400 !important;
}

.tabulator-cell {
  border-right: 1px solid #1f1f1f !important;
}

.tabulator-footer {
  background: #181818 !important;
  border-top: 1px solid #2a2a2a !important;
}

.tabulator-page {
  background: #242424 !important;
  color: white !important;
  border: none !important;
  border-radius: 6px;
}

.tabulator-page.active {
  background: #ff9f1c !important;
  color: black !important;
}

/* TOUR TIPS */

.tour-tip {

  position: absolute;

  background: #ff9f1c;

  color: black;

  padding: 12px 14px;

  border-radius: 12px;

  font-weight: 700;

  max-width: 260px;

  z-index: 10000;

  box-shadow:
    0 10px 30px rgba(0,0,0,0.35);

}

/* MOBILE */

@media (max-width: 768px) {

  body {
    padding: 16px;
  }

  h1 {
    font-size: 2rem;
  }

  .logo {
    width: 56px;
    height: 56px;
  }

}

</style>
</head>

<body>

<div class="hero">

  <div class="hero-title">

    <img
      src="logo.png"
      alt="Logo"
      class="logo"
      onerror="this.style.display='none'"
    />

    <h1>Song Library</h1>

  </div>

  <p id="subtitle">
    Loading collection...
  </p>

</div>

<input
  id="search-input"
  type="text"
  placeholder="Search songs, artists, albums..."
/>

<div id="genres-container"></div>

<div
  class="tour-tip"
  id="search-tip"
  style="
    top: 140px;
    left: 50%;
    transform: translateX(-50%);
  "
>
  🔎 Search for songs, artists, or albums here
</div>

<script src="https://unpkg.com/tabulator-tables@5.5.2/dist/js/tabulator.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<script>

let genres = [];

const tables = {};

function safeId(name) {

  return name.replace(/[^a-zA-Z0-9]/g, "_");

}

async function loadGenres() {

  try {

    const response =
      await fetch("genres.json");

    genres = await response.json();

    buildFolders();

    let totalSongs = 0;

    for (const genre of genres) {

      Papa.parse(genre.file, {

        download: true,
        header: true,
        skipEmptyLines: true,

        complete: function(results) {

          const songs =
            results.data.filter(song => {

              return (
                song.Title &&
                song.Title.trim() !== ""
              );

            });

          tables[genre.name] = songs;

          totalSongs += songs.length;

          document.getElementById(
            "count-" + safeId(genre.name)
          ).textContent =
            songs.length + " tracks";

          document.getElementById(
            "subtitle"
          ).textContent =
            totalSongs.toLocaleString() +
            " searchable tracks";

        },

        error: function() {

          document.getElementById(
            "count-" + safeId(genre.name)
          ).textContent =
            "Failed to load";

        }

      });

    }

  } catch (err) {

    console.error(err);

    document.getElementById(
      "subtitle"
    ).textContent =
      "Failed to load collection";

  }

}

function buildFolders() {

  const container =
    document.getElementById(
      "genres-container"
    );

  container.innerHTML = "";

  genres.forEach(genre => {

    const id = safeId(genre.name);

    const block =
      document.createElement("div");

    block.className = "genre-block";

    block.innerHTML = `

      <div
        class="genre-header"
        onclick="toggleGenre('${genre.name}')"
      >

        <div class="genre-icon">
          📁
        </div>

        <div class="genre-name">
          ${genre.name}
        </div>

        <div
          class="genre-count"
          id="count-${id}"
        >
          Loading...
        </div>

      </div>

      <div
        class="genre-content"
        id="content-${id}"
      >

        <div id="table-${id}"></div>

      </div>

    `;

    container.appendChild(block);

  });

}

function showSortTip(id) {

  const oldTip =
    document.getElementById(
      "sort-tip"
    );

  if (oldTip) {
    oldTip.remove();
  }

  setTimeout(() => {

    const header =
      document.querySelector(
        "#table-" + id + " .tabulator-header"
      );

    if (!header) return;

    const rect =
      header.getBoundingClientRect();

    const tip =
      document.createElement("div");

    tip.id = "sort-tip";

    tip.className = "tour-tip";

    // detect mobile
    const isMobile =
      window.innerWidth <= 768;

    if (isMobile) {

      tip.innerHTML =
        "↔️ Swipe left and right to see more columns";

    } else {

      tip.innerHTML =
        "⬆️ Click column names to sort songs";

    }

    tip.style.top =
      (window.scrollY + rect.top - 70) + "px";

    tip.style.left =
      (window.scrollX + rect.left + 20) + "px";

    document.body.appendChild(tip);

    setTimeout(() => {

      tip.remove();

    }, 9000);

  }, 300);

}

function createTable(id, songs) {

  return new Tabulator(
    "#table-" + id,
    {

      data: songs,

      layout: "fitColumns",

      pagination: true,

      paginationSize: 50,

      movableColumns: true,

      columns: [

        {
          title: "Title",
          field: "Title",
          minWidth: 220
        },

        {
          title: "Artist",
          field: "Artist",
          minWidth: 220
        },

        {
          title: "Album",
          field: "Album",
          minWidth: 300
        },

        {
          title: "Year",
          field: "Year",
          width: 100,
          hozAlign: "center"
        },

        {
          title: "Length",
          field: "Length",
          width: 100,
          hozAlign: "center"
        },

        {
          title: "BPM",
          field: "BPM",
          width: 90,
          hozAlign: "center"
        }

      ]

    }
  );

}

function toggleGenre(name) {

  const id = safeId(name);

  const content =
    document.getElementById(
      "content-" + id
    );

  const isOpen =
    content.classList.contains("open");

  if (isOpen) {

    content.classList.remove("open");

    return;

  }

  content.classList.add("open");

  const songs =
    tables[name] || [];

  if (
    content.dataset.loaded !== "true"
  ) {

    createTable(id, songs);

    content.dataset.loaded = "true";

  }

  showSortTip(id);

}

let searchTimeout;

document
  .getElementById("search-input")
  .addEventListener(
    "input",
    function() {

      clearTimeout(searchTimeout);

      const input = this;

      searchTimeout =
        setTimeout(() => {

          const value =
            input.value
              .toLowerCase()
              .trim();

          genres.forEach(genre => {

            const id =
              safeId(genre.name);

            const block =
              document
                .getElementById(
                  "content-" + id
                )
                .parentElement;

            const content =
              document.getElementById(
                "content-" + id
              );

            const songs =
              tables[genre.name] || [];

            const filtered =
              value
                ? songs.filter(song => {

                    return (
                      song.Title?.toLowerCase().includes(value) ||
                      song.Artist?.toLowerCase().includes(value) ||
                      song.Album?.toLowerCase().includes(value)
                    );

                  })
                : songs;

            document.getElementById(
              "count-" + id
            ).textContent =
              filtered.length + " tracks";

            if (
              value &&
              filtered.length === 0
            ) {

              block.style.display = "none";

              content.classList.remove("open");

              return;

            }

            block.style.display = "block";

            let table =
              Tabulator.findTable(
                "#table-" + id
              )[0];

            if (!table) {

              table =
                createTable(
                  id,
                  filtered
                );

            } else {

              table.setData(filtered);

            }

            if (value) {

              content.classList.add("open");

            } else {

              content.classList.remove("open");

            }

          });

        }, 180);

    }

  );

setTimeout(() => {

  const tip =
    document.getElementById(
      "search-tip"
    );

  if (tip) {

    tip.remove();

  }

}, 11000);

loadGenres();

</script>

</body>
</html>
