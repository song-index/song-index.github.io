<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Song Library</title>

<link href="https://unpkg.com/tabulator-tables@5.5.2/dist/css/tabulator.min.css" rel="stylesheet"/>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: Inter, Arial, sans-serif;
  background: #0b0b0b;
  color: #f5f5f5;
  min-height: 100vh;
  padding: 24px;
}

/* ── HERO ── */
.hero { margin-bottom: 20px; }
.hero-title { display: flex; align-items: center; gap: 16px; }
.logo { width: 72px; height: 72px; object-fit: cover; border-radius: 16px; flex-shrink: 0; }
.hero h1 { font-size: 2.5rem; margin: 0; }
.hero p { margin-top: 8px; color: #ff9f1c; font-size: 0.9rem; }

/* ── SEARCH ── */
#search-input {
  width: 100%;
  padding: 14px 16px;
  border: none;
  border-radius: 14px;
  background: #1a1a1a;
  color: white;
  font-size: 16px;
  outline: none;
  margin-bottom: 24px;
  display: block;
}
#search-input::placeholder { color: #777; }
#search-input:focus { box-shadow: 0 0 0 2px #ff9f1c44; }

/* ── GENRE FOLDER ROW ── */
.genre-block { margin-bottom: 6px; }

.genre-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  background: #161616;
  border-radius: 10px;
  cursor: pointer;
  user-select: none;
  border: 1px solid #222;
  transition: background 0.15s, border-color 0.15s;
}
.genre-header:hover { background: #1e1600; border-color: #3a2800; }
.genre-header.open  { background: #1a1400; border-color: #3a2800; border-radius: 10px 10px 0 0; }

.genre-icon { font-size: 1rem; flex-shrink: 0; }
.genre-name { font-size: 0.9rem; font-weight: 600; color: #ff9f1c; flex: 1; letter-spacing: 0.3px; }
.genre-count {
  font-size: 0.72rem; color: #666;
  background: #1f1f1f; padding: 2px 8px;
  border-radius: 20px; font-family: 'Courier New', monospace;
}
.genre-chevron { color: #555; font-size: 0.65rem; transition: transform 0.2s; flex-shrink: 0; }
.genre-header.open .genre-chevron { transform: rotate(180deg); }

/* ── SONG TABLE WRAPPER ── */
.genre-songs {
  max-height: 0;
  overflow: hidden;
  border: 1px solid transparent;
  border-top: none;
  border-radius: 0 0 10px 10px;
  transition: max-height 0.2s ease, border-color 0.2s ease;
}
.genre-songs.open {
  max-height: 2000px;
  border-color: #3a2800;
}

/* ── TABULATOR OVERRIDES ── */
.genre-songs .tabulator             { border: none !important; background: #121212 !important; border-radius: 0 !important; }
.genre-songs .tabulator-header      { background: #1a1a1a !important; border-bottom: 1px solid #2a2a2a !important; }
.genre-songs .tabulator-col         { background: #181818 !important; color: #ff9f1c !important; border-right: 1px solid #2a2a2a !important; font-size: 0.8rem !important; }
.genre-songs .tabulator-col:hover   { background: #201600 !important; }
.genre-songs .tabulator-col-title   { color: #ff9f1c !important; }
.genre-songs .tabulator-row         { background: #121212 !important; color: #f5f5f5 !important; border-bottom: 1px solid #1f1f1f !important; min-height: 32px !important; }
.genre-songs .tabulator-row:nth-child(even) { background: #161616 !important; }
.genre-songs .tabulator-row:hover   { background: #1e1200 !important; }
.genre-songs .tabulator-cell        { border-right: 1px solid #1f1f1f !important; padding: 6px 10px !important; font-size: 0.85rem !important; }
.genre-songs .tabulator-footer      { background: #181818 !important; border-top: 1px solid #2a2a2a !important; color: #777 !important; }
.genre-songs .tabulator-page        { background: #242424 !important; color: white !important; border: none !important; border-radius: 6px !important; margin: 0 3px !important; }
.genre-songs .tabulator-page.active { background: white !important; color: black !important; }
.genre-songs .tabulator-page-size   { background: #1a1a1a !important; color: white !important; border: 1px solid #333 !important; border-radius: 6px !important; }

/* loading / error */
.genre-loading { padding: 16px; text-align: center; font-size: 0.8rem; color: #555; background: #111; }
.genre-error   { padding: 20px; text-align: center; font-size: 0.82rem; color: #ff6b6b; background: #111; }
.genre-error code { color: #ff9f1c; font-size: 0.78rem; }

/* top stats */
.topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.topbar-stats { font-size: 0.78rem; color: #555; }
.topbar-stats span { color: #ff9f1c; }
</style>
</head>
<body>

<div class="hero">
  <div class="hero-title">
    <img src="logo.png" alt="Logo" class="logo" onerror="this.style.display='none'"/>
    <h1>Song Library</h1>
  </div>
  <p id="subtitle">Loading collection…</p>
</div>

<input id="search-input" type="text" placeholder="Search songs, artists, albums..."/>

<div class="topbar">
  <div class="topbar-stats" id="stats"></div>
</div>

<div id="genres-container"></div>

<script src="https://unpkg.com/tabulator-tables@5.5.2/dist/js/tabulator.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script>

// ─── STATE ───────────────────────────────────────────────────────────────────
const cache  = {};   // genreName → song[]
const tables = {};   // genreName → Tabulator instance
const errors = {};   // genreName → error string
let genres   = [];
let searchVal = '';

// ─── UTILS ───────────────────────────────────────────────────────────────────
function secsToMmss(val) {
  const s = parseInt(val, 10);
  if (isNaN(s) || s <= 0) return val || '';
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

function normalizeSong(row) {
  const len = (row.Length || row.length || '').trim();
  return {
    Title:  (row.Title  || row.title  || '').trim(),
    Artist: (row.Artist || row.artist || '').trim(),
    Album:  (row.Album  || row.album  || '').trim(),
    Year:   (row.Year   || row.year   || '').trim(),
    Length: /^\d+$/.test(len) ? secsToMmss(len) : len,
    BPM:    (row.BPM    || row.bpm    || '').trim(),
  };
}

function parseCsv(file) {
  return new Promise(resolve => {
    Papa.parse(file, {
      download: true,
      header: true,
      skipEmptyLines: true,
      complete: r => {
        const songs = r.data.map(normalizeSong).filter(s => s.Title);
        resolve({ songs, error: null });
      },
      error: err => resolve({ songs: [], error: err.message || 'File not found' })
    });
  });
}

// ─── BUILD FOLDER LIST ────────────────────────────────────────────────────────
function buildFolders() {
  const container = document.getElementById('genres-container');
  container.innerHTML = '';
  genres.forEach(g => {
    const sid = g.name.replace(/[^a-zA-Z0-9]/g, '_');
    const block = document.createElement('div');
    block.className = 'genre-block';
    block.innerHTML = `
      <div class="genre-header" id="hdr-${sid}" onclick="toggleGenre(${JSON.stringify(g.name)})">
        <span class="genre-icon">📁</span>
        <span class="genre-name">${g.name}</span>
        <span class="genre-count" id="cnt-${sid}">—</span>
        <span class="genre-chevron">▼</span>
      </div>
      <div class="genre-songs" id="songs-${sid}">
        <div class="genre-loading" id="tbl-${sid}">Click to load…</div>
      </div>`;
    container.appendChild(block);
  });
}

function sid(name) { return name.replace(/[^a-zA-Z0-9]/g, '_'); }

// ─── TABULATOR COLUMNS ────────────────────────────────────────────────────────
const COLUMNS = [
  { title: 'Title',  field: 'Title',  minWidth: 200 },
  { title: 'Artist', field: 'Artist', minWidth: 180 },
  { title: 'Album',  field: 'Album',  minWidth: 260 },
  { title: 'Year',   field: 'Year',   width: 90,  hozAlign: 'center' },
  { title: 'Length', field: 'Length', width: 90,  hozAlign: 'center' },
  { title: 'BPM',    field: 'BPM',    width: 80,  hozAlign: 'center' },
];

// ─── RENDER TABLE ─────────────────────────────────────────────────────────────
function renderTable(genreName, songs) {
  const id = sid(genreName);
  const tblDiv = document.getElementById('tbl-' + id);
  if (!tblDiv) return;

  let data = songs;
  if (searchVal) {
    const q = searchVal.toLowerCase();
    data = songs.filter(s =>
      s.Title.toLowerCase().includes(q)  ||
      s.Artist.toLowerCase().includes(q) ||
      s.Album.toLowerCase().includes(q)
    );
  }

  const badge = document.getElementById('cnt-' + id);
  if (badge) badge.textContent = searchVal
    ? `${data.length} / ${songs.length}`
    : `${songs.length} tracks`;

  if (tables[genreName]) {
    tables[genreName].setData(data);
    return;
  }

  tblDiv.innerHTML = '';
  tables[genreName] = new Tabulator(tblDiv, {
    data,
    layout: 'fitColumns',
    pagination: true,
    paginationSize: 50,
    movableColumns: true,
    columns: COLUMNS,
  });
}

// ─── TOGGLE OPEN/CLOSE ────────────────────────────────────────────────────────
async function toggleGenre(genreName) {
  const id   = sid(genreName);
  const hdr  = document.getElementById('hdr-'   + id);
  const wrap = document.getElementById('songs-' + id);
  const icon = hdr.querySelector('.genre-icon');

  if (wrap.classList.contains('open')) {
    hdr.classList.remove('open');
    wrap.classList.remove('open');
    icon.textContent = '📁';
    return;
  }

  hdr.classList.add('open');
  wrap.classList.add('open');
  icon.textContent = '📂';

  if (cache[genreName] !== undefined) {
    renderTable(genreName, cache[genreName]);
    return;
  }

  // Load the CSV
  const genre = genres.find(g => g.name === genreName);
  if (!genre) return;

  document.getElementById('tbl-' + id).innerHTML =
    '<div class="genre-loading">Loading…</div>';

  const { songs, error } = await parseCsv(genre.file);

  if (error || songs.length === 0) {
    cache[genreName] = [];
    const badge = document.getElementById('cnt-' + id);
    if (badge) badge.textContent = '⚠️ not found';
    document.getElementById('tbl-' + id).innerHTML = `
      <div class="genre-error">
        ⚠️ Could not load songs for <strong>${genreName}</strong><br><br>
        Expected file: <code>${genre.file}</code><br><br>
        <span style="color:#888;font-size:0.75rem;">
          Make sure the CSV is inside the <code>csv/</code> folder on GitHub<br>
          and the filename matches exactly (including capitals and spaces).
        </span>
      </div>`;
    return;
  }

  cache[genreName] = songs;
  renderTable(genreName, songs);
}

// ─── SEARCH ──────────────────────────────────────────────────────────────────
let searchTimer;
document.getElementById('search-input').addEventListener('input', function () {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(async () => {
    searchVal = this.value.trim();
    const q = searchVal.toLowerCase();

    if (!q) {
      genres.forEach(g => {
        const id   = sid(g.name);
        const hdr  = document.getElementById('hdr-'   + id);
        const wrap = document.getElementById('songs-' + id);
        if (!hdr) return;
        hdr.classList.remove('open');
        wrap.classList.remove('open');
        hdr.querySelector('.genre-icon').textContent = '📁';
        if (cache[g.name]) renderTable(g.name, cache[g.name]);
      });
      updateStats();
      return;
    }

    let totalMatches = 0;
    for (const g of genres) {
      // Load if not yet cached
      if (cache[g.name] === undefined) {
        const { songs } = await parseCsv(g.file);
        cache[g.name] = songs;
        const badge = document.getElementById('cnt-' + sid(g.name));
        if (badge) badge.textContent = `${songs.length} tracks`;
      }

      const matches = (cache[g.name] || []).filter(s =>
        s.Title.toLowerCase().includes(q)  ||
        s.Artist.toLowerCase().includes(q) ||
        s.Album.toLowerCase().includes(q)
      );

      const id   = sid(g.name);
      const hdr  = document.getElementById('hdr-'   + id);
      const wrap = document.getElementById('songs-' + id);
      if (!hdr || !wrap) continue;

      if (matches.length > 0) {
        hdr.classList.add('open');
        wrap.classList.add('open');
        hdr.querySelector('.genre-icon').textContent = '📂';
        renderTable(g.name, cache[g.name]);
        totalMatches += matches.length;
      } else {
        hdr.classList.remove('open');
        wrap.classList.remove('open');
        hdr.querySelector('.genre-icon').textContent = '📁';
      }
    }

    document.getElementById('stats').innerHTML =
      `<span>${totalMatches.toLocaleString()}</span> results for "${searchVal}"`;
  }, 250);
});

// ─── STATS ───────────────────────────────────────────────────────────────────
function updateStats() {
  const total = Object.values(cache).reduce((a, b) => a + (b||[]).length, 0);
  document.getElementById('stats').innerHTML =
    `<span>${total.toLocaleString()}</span> tracks loaded`;
}

// ─── INIT ────────────────────────────────────────────────────────────────────
(async function init() {
  try {
    const res = await fetch('genres.json');
    if (!res.ok) throw new Error('not found');
    genres = await res.json();
  } catch (e) {
    document.getElementById('genres-container').innerHTML =
      '<p style="color:#ff4444;padding:20px;font-size:0.9rem;">⚠️ Could not load <code>genres.json</code>. Make sure it exists in the root of the repo.</p>';
    return;
  }

  buildFolders();

  // Background-load all CSVs for counts and pre-build tables
  await Promise.all(genres.map(async g => {
    const { songs } = await parseCsv(g.file);
    cache[g.name] = songs;
    const badge = document.getElementById('cnt-' + sid(g.name));
    if (badge) badge.textContent = songs.length > 0
      ? `${songs.length} tracks`
      : '⚠️ not found';
    // Build the Tabulator now while container exists in DOM (even if collapsed)
    if (songs.length > 0) renderTable(g.name, songs);
  }));

  const total = Object.values(cache).reduce((a, b) => a + (b||[]).length, 0);
  document.getElementById('subtitle').textContent =
    `${total.toLocaleString()} searchable tracks`;
  document.getElementById('stats').innerHTML =
    `<span>${total.toLocaleString()}</span> tracks across ${genres.length} genres`;
})();
</script>
</body>
</html>
